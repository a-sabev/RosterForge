spring.application.name=rosterforge

# --- HashiCorp Vault ---
# The AppRole login (role-id/secret-id) is written by docker/vault/bootstrap.sh as files
# named after the properties; configtree loads them before the Vault import runs.
# optional: only lets tests disable Vault; fail-fast still stops startup if Vault is down.
spring.config.import=optional:configtree:${ROSTERFORGE_SECRETS_DIR:docker/.secrets/},optional:vault://
spring.cloud.vault.uri=http://localhost:8200
spring.cloud.vault.authentication=APPROLE
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=rosterforge
spring.cloud.vault.fail-fast=true

spring.datasource.url=jdbc:postgresql://localhost:5434/rosterforge
spring.datasource.driver-class-name=org.postgresql.Driver

spring.kafka.bootstrap-servers=localhost:9094
