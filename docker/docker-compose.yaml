name: rosterforge

services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: rosterforge-postgres
    environment:
      POSTGRES_DB: rosterforge
      POSTGRES_USER: rosterforge
      POSTGRES_PASSWORD: rosterforge
    ports:
      - "5434:5432"
    volumes:
      - rosterforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rosterforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  vault:
    image: docker.io/hashicorp/vault:latest
    container_name: rosterforge-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    
  kafka:
    image: apache/kafka:latest
    container_name: rosterforge-kafka
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

volumes:
  rosterforge_pgdata: