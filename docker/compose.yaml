name: rosterforge

# Run from the repo root:
#   Infra only (run the app from your IDE):
#     docker compose -f docker/compose.yaml up -d
#   Full stack, app included:
#     docker compose -f docker/compose.yaml --profile app up -d --build
#
# No secrets live in this file or in git. On first start, secrets-init generates this
# machine's Postgres passwords and vault-bootstrap initializes Vault and issues the
# app's AppRole credentials. See docker/README.md for the security model.
#
# Every port is bound to 127.0.0.1 so nothing is reachable from the local network.

services:
  # One-shot: generates the Postgres passwords into a volume, once per machine.
  secrets-init:
    image: docker.io/hashicorp/vault:1.18 # only used for its shell, avoids another image pull
    entrypoint: ["/bin/sh", "/scripts/generate.sh"]
    volumes:
      - ./secrets/generate.sh:/scripts/generate.sh:ro
      - postgres-secrets:/secrets
    restart: "no"

  postgres:
    image: docker.io/library/postgres:16
    container_name: rosterforge-postgres
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: rosterforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres/superuser_password
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - postgres-secrets:/run/secrets/postgres:ro
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rosterforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  vault:
    image: docker.io/hashicorp/vault:1.18
    container_name: rosterforge-vault
    command: ["server"]
    environment:
      # mlock is disabled in vault.hcl; skipping setcap lets this run under rootless Podman.
      SKIP_SETCAP: "true"
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./vault/vault.hcl:/vault/config/vault.hcl:ro
      - vault-data:/vault/file
    healthcheck:
      # Healthy once the server answers, whatever its seal state; vault-bootstrap unseals it.
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8200/v1/sys/health?uninitcode=200&sealedcode=200&standbycode=200'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: initializes Vault on first start, unseals it on every start, and (re)applies
  # the policy, AppRole and datasource secret the app needs.
  vault-bootstrap:
    image: docker.io/hashicorp/vault:1.18
    container_name: rosterforge-vault-bootstrap
    entrypoint: ["/bin/sh", "/scripts/bootstrap.sh"]
    depends_on:
      vault:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: http://vault:8200
    volumes:
      - ./vault/bootstrap.sh:/scripts/bootstrap.sh:ro
      - ./vault/rosterforge-app-policy.hcl:/scripts/rosterforge-app-policy.hcl:ro
      - vault-keys:/vault-keys
      - postgres-secrets:/run/secrets/postgres:ro
      - app-secrets:/out/container
      - ./.secrets:/out/host # read by the app when run from the IDE
    restart: "no"

  kafka:
    image: docker.io/apache/kafka:4.0.0
    container_name: rosterforge-kafka
    ports:
      - "127.0.0.1:9094:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL is for containers on the compose network, EXTERNAL for the host (localhost:9094).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Single broker: internal topics can't use the default replication factor of 3.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  app:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
    image: rosterforge:local
    container_name: rosterforge-app
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      vault-bootstrap:
        condition: service_completed_successfully
    environment:
      ROSTERFORGE_SECRETS_DIR: /run/secrets/rosterforge/
      # Override the localhost addresses in application.properties with compose service names.
      SPRING_CLOUD_VAULT_URI: http://vault:8200
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rosterforge
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - app-secrets:/run/secrets/rosterforge:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  postgres-secrets:
  vault-data:
  vault-keys:
  app-secrets:
